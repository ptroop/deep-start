name: Financial Digest Scraper

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * 1-5'   # 1:00 AM UTC weekdays (~6:30 AM IST)
    - cron: '0 12 * * 1-5'  # 12:00 PM UTC weekdays (~5:30 PM IST)
  workflow_dispatch:

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python src/scraper.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "action@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update data.json [skip ci]"
          git push
